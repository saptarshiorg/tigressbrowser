<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>MacStyleBrowser</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="titlebar">
    <div class="traffic-lights">
      <button class="light close" id="btn-close"></button>
      <button class="light minimize" id="btn-minimize"></button>
      <button class="light maximize" id="btn-maximize"></button>
    </div>

    <div class="tabs" id="tabs"></div>
    <button class="new-tab" id="new-tab">＋</button>
  </div>

  <div class="toolbar">
    <button id="nav-back">‹</button>
    <button id="nav-forward">›</button>
    <button id="nav-reload">⟳</button>
    <form id="url-form">
      <input id="url-input" type="text" placeholder="Search or enter address" autocomplete="off" />
    </form>
    <button id="vlc-fallback" title="Open current page's stream in VLC">▶ VLC</button>
  </div>

  <div class="view-container" id="view-container">
    <!-- <webview> elements are injected per-tab by renderer.js -->
  </div>

  <script src="renderer.js"></script>
</body>
</html>
